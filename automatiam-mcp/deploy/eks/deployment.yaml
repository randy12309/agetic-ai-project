apiVersion: apps/v1
kind: Deployment
metadata:
  name: automatiam-mcp
  labels:
    app.kubernetes.io/name: automatiam-mcp
    app.kubernetes.io/part-of: automatiam
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: automatiam-mcp
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: automatiam-mcp
        app.kubernetes.io/part-of: automatiam
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: automatiam-mcp
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Longer than the server's own graceful shutdown budget, so in-flight tool […]
      # before the kubelet escalates to SIGKILL.
      terminationGracePeriodSeconds: 45
      containers:
        - name: automatiam-mcp
          # Replace with the enterprise registry path; this repository does not […]
          image: REPLACE_ME/automatiam-mcp:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AUTOMATIAM_MCP_REQUIRED_GROUPS
              valueFrom:
                configMapKeyRef:
                  name: automatiam-mcp-config
                  key: requiredGroups
            - name: AUTOMATIAM_MCP_OIDC_ISSUER_URI
              valueFrom:
                configMapKeyRef:
                  name: automatiam-mcp-config
                  key: oidcIssuerUri
            - name: AUTOMATIAM_MCP_OIDC_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: automatiam-mcp-config
                  key: oidcAudience
            - name: AUTOMATIAM_MCP_ONEIAM_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: automatiam-mcp-config
                  key: oneIamBaseUrl
            # Reference only. The Secret is created by the platform; this reposi […]
            # defines nor ships its contents.
            - name: AUTOMATIAM_MCP_ONEIAM_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: automatiam-mcp-secrets
                  key: oneIamClientSecret
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              # No CPU limit: throttling a JVM mid-request turns a latency blip […]
              # Memory is limited because an unbounded heap is a node-level prob […]
              memory: 1536Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            # Generous, because a JVM cold start is slow and a tight budget here […]
            # loop that looks like a crash.
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp

        - name: opa
          # Enterprise-approved OPA. Registry path is environment-specific; the […]
          image: REPLACE_ME/openpolicyagent/opa:1.22.3
          args:
            - "run"
            - "--server"
            # Keep policy queries on loopback. The kubelet probes the Pod IP.
            - "--addr=127.0.0.1:8181"
            - "--diagnostic-addr=0.0.0.0:8282"
            - "--config-file=/config/opa-config.yaml"
          securityContext:
            runAsNonRoot: true
            # Original container-specific setting is outside the captured rows.
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8282
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health?bundle=true
              port: 8282
            periodSeconds: 5
          volumeMounts:
            - name: opa-config
              mountPath: /config
              readOnly: true

      volumes:
        - name: tmp
          emptyDir: {}
        - name: opa-config
          configMap:
            name: automatiam-mcp-opa-config
