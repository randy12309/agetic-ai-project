# Default-deny for this workload, then the two flows it actually needs.
#
# There is no rule permitting ingress to OPA: it binds to loopback inside the po […]
# policy never sees that traffic and no rule could usefully allow or deny it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: automatiam-mcp-default-deny
  labels:
    app.kubernetes.io/name: automatiam-mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: automatiam-mcp
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: automatiam-mcp-allow
  labels:
    app.kubernetes.io/name: automatiam-mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: automatiam-mcp
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the orchestration API may reach the MCP endpoint. Authentication is s […]
    # this narrows who can even attempt it.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: automatiam-orchestration
      ports:
        - port: 8080
          protocol: TCP
    # Prometheus scraping.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # OneIAM capability APIs, the OIDC issuer's JWKS endpoint, and the policy bu […]
    # Narrow the CIDR to the actual egress range for the environment before depl […]
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
      ports:
        - port: 443
          protocol: TCP
